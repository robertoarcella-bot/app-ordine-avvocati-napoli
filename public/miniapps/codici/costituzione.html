inanza pubblica e del sistema tributario. Dispongono di compartecipazioni al gettito di tributi erariali riferibile al loro territorio.</p>\n<p>La legge dello Stato istituisce un fondo perequativo, senza vincoli di destinazione, per i territori con minore capacità fiscale per abitante.</p>\n<p>Le risorse derivanti dalle fonti di cui ai commi precedenti consentono ai Comuni, alle Province, alle Città metropolitane e alle Regioni di finanziare integralmente le funzioni pubbliche loro attribuite.</p>\n<p>Per promuovere lo sviluppo economico, la coesione e la solidarietà sociale, per rimuovere gli squilibri economici e sociali, per favorire l'effettivo esercizio dei diritti della persona, o per provvedere a scopi diversi dal normale esercizio delle loro funzioni, lo Stato destina risorse aggiuntive ed effettua interventi speciali in favore di determinati Comuni, Province, Città metropolitane e Regioni.</p>\n<p>La Repubblica riconosce le peculiarità delle Isole e promuove le misure necessarie a rimuovere gli svantaggi derivanti dall'insularità.</p>\n<p>I Comuni, le Province, le Città metropolitane e le Regioni hanno un proprio patrimonio, attribuito secondo i principi generali determinati dalla legge dello Stato. Possono ricorrere all'indebitamento solo per finanziare spese di investimento, con la contestuale definizione di piani di ammortamento e a condizione che per il complesso degli enti di ciascuna Regione sia rispettato l'equilibrio di bilancio. È esclusa ogni garanzia dello Stato sui prestiti dagli stessi contratti. (19)</p>","notesHtml":"<p>AGGIORNAMENTO (19)</p>\n<p>La L. costituzionale 20 aprile 2012, n. 1 ha disposto (con l'art. 6, comma 1) che le suddette modifiche si applicano a decorrere dall'esercizio finanziario relativo all'anno 2014.</p>"},{"id":"art_120","numText":"Art. 120","group":"-","heading":"","contentHtml":"<p>La Regione non può istituire dazi di importazione o esportazione o transito tra le Regioni, né adottare provvedimenti che ostacolino in qualsiasi modo la libera circolazione delle persone e delle cose tra le Regioni, né limitare l'esercizio del diritto al lavoro in qualunque parte del territorio nazionale.</p>\n<p>Il Governo può sostituirsi a organi delle Regioni, delle Città metropolitane, delle Province e dei Comuni nel caso di mancato rispetto di norme e trattati internazionali o della normativa comunitaria oppure di pericolo grave per l'incolumità e la sicurezza pubblica, ovvero quando lo richiedono la tutela dell'unità giuridica o dell'unità economica e in particolare la tutela dei livelli essenziali delle prestazioni concernenti i diritti civili e sociali, prescindendo dai confini territoriali dei governi locali. La legge definisce le procedure atte a garantire che i poteri sostitutivi siano esercitati nel rispetto del principio di sussidiarietà e del principio di leale collaborazione.</p>","notesHtml":""},{"id":"art_121","numText":"Art. 121","group":"-","heading":"","contentHtml":"<p>Sono organi della Regione: il Consiglio regionale, la Giunta e il suo presidente.</p>\n<p>Il Consiglio regionale esercita le potestà legislative . . . attribuite alla Regione e le altre funzioni conferitegli dalla Costituzione e dalle leggi. Può fare proposte di legge alle Camere.</p>\n<p>La Giunta regionale è l'organo esecutivo delle Regioni.</p>\n<p>Il Presidente della Giunta rappresenta la Regione; dirige la politica della Giunta e ne è responsabile; promulga le leggi ed emana i regolamenti regionali; dirige le funzioni amministrative delegate dallo Stato alla Regione, conformandosi alle istruzioni del Governo della Repubblica.</p>","notesHtml":""},{"id":"art_122","numText":"Art. 122","group":"-","heading":"","contentHtml":"<p>Il sistema di elezione e i casi di ineleggibilità e di incompatibilità del Presidente e degli altri componenti della Giunta regionale nonché dei consiglieri regionali sono disciplinati con legge della Regione nei limiti dei principi fondamentali stabiliti con legge della Repubblica, che stabilisce anche la durata degli organi elettivi.</p>\n<p>Nessuno può appartenere contemporaneamente a un Consiglio o a una Giunta regionale e ad una delle Camere del Parlamento, ad un altro Consiglio o ad altra Giunta regionale, ovvero al Parlamento europeo.</p>\n<p>Il Consiglio elegge tra i suoi componenti un Presidente e un ufficio di presidenza.</p>\n<p>I consiglieri regionali non possono essere chiamati a rispondere delle opinioni espresse e dei voti dati nell'esercizio delle loro funzioni.</p>\n<p>Il Presidente della Giunta regionale, salvo che lo statuto regionale disponga diversamente, è eletto a suffragio universale e diretto. Il Presidente eletto nomina e revoca i componenti della Giunta.</p>","notesHtml":""},{"id":"art_123","numText":"Art. 123","group":"-","heading":"","contentHtml":"<p>Ciascuna Regione ha uno statuto che, in armonia con la Costituzione, ne determina la forma di governo e i principi fondamentali di organizzazione e funzionamento. Lo statuto regola l'esercizio del diritto di iniziativa e del referendum su leggi e provvedimenti amministrativi della Regione e la pubblicazione delle leggi e dei regolamenti regionali.</p>\n<p>Lo statuto è approvato e modificato dal Consiglio regionale con legge approvata a maggioranza assoluta dei suoi componenti, con due deliberazioni successive adottate ad intervallo non minore di due mesi. Per tale legge non è richiesta l'apposizione del visto da parte del Commissario del Governo. Il Governo della Repubblica può promuovere la questione di legittimità costituzionale sugli statuti regionali dinanzi alla Corte costituzionale entro trenta giorni dalla loro pubblicazione.</p>\n<p>Lo statuto è sottoposto a referendum popolare qualora entro tre mesi dalla sua pubblicazione ne faccia richiesta un cinquantesimo degli elettori della Regione o un quinto dei componenti il Consiglio regionale. Lo statuto sottoposto a referendum non è promulgato se non è approvato dalla maggioranza dei voti validi.</p>\n<p>In ogni Regione, lo statuto disciplina il Consiglio delle autonomie locali, quale organo di consultazione fra la Regione e gli enti locali.</p>","notesHtml":""},{"id":"art_124","numText":"Art. 124","group":"-","heading":"ARTICOLO ABROGATO DALLA L. COSTITUZIONALE 18 OTTOBRE 2001, N. 3","contentHtml":"","notesHtml":""},{"id":"art_125","numText":"Art. 125","group":"-","heading":"","contentHtml":"<p>COMMA ABROGATO DALLA L. COSTITUZIONALE 18 OTTOBRE 2001, N. 3.</p>\n<p>Nella Regione sono istituiti organi di giustizia amministrativa di primo grado, secondo l'ordinamento stabilito da legge della Repubblica. Possono istituirsi sezioni con sede diversa dal capoluogo della Regione.</p>","notesHtml":""},{"id":"art_126","numText":"Art. 126","group":"-","heading":"","contentHtml":"<p>Con decreto motivato del Presidente della Repubblica sono disposti lo scioglimento del Consiglio regionale e la rimozione del Presidente della Giunta che abbiano compiuto atti contrari alla Costituzione o gravi violazioni di legge. Lo scioglimento e la rimozione possono altresì essere disposti per ragioni di sicurezza nazionale. Il decreto è adottato sentita una Commissione di deputati e senatori costituita, per le questioni regionali, nei modi stabiliti con legge della Repubblica.</p>\n<p>Il Consiglio regionale può esprimere la sfiducia nei confronti del Presidente della Giunta mediante mozione motivata, sottoscritta da almeno un quinto dei suoi componenti e approvata per appello nominale a maggioranza assoluta dei componenti. La mozione non può essere messa in discussione prima di tre giorni dalla presentazione.</p>\n<p>L'approvazione della mozione di sfiducia nei confronti del Presidente della Giunta eletto a suffragio universale e diretto, nonché la rimozione, l'impedimento permanente, la morte o le dimissioni volontarie dello stesso comportano le dimissioni della Giunta e lo scioglimento del Consiglio. In ogni caso i medesimi effetti conseguono alle dimissioni contestuali della maggioranza dei componenti il Consiglio.</p>","notesHtml":""},{"id":"art_127","numText":"Art. 127","group":"-","heading":"","contentHtml":"<p>Il Governo, quando ritenga che una legge regionale ecceda la competenza della Regione, può promuovere la questione di legittimità costituzionale dinanzi alla Corte costituzionale entro sessanta giorni dalla sua pubblicazione.</p>\n<p>La Regione, quando ritenga che una legge o un atto avente valore di legge dello Stato o di un'altra Regione leda la sua sfera di competenza, può promuovere la questione di legittimità costituzionale dinanzi alla Corte costituzionale entro sessanta giorni dalla pubblicazione della legge o dell'atto avente valore di legge.</p>","notesHtml":""},{"id":"art_128","numText":"Art. 128","group":"-","heading":"ARTICOLO ABROGATO DALLA L. COSTITUZIONALE 18 OTTOBRE 2001, N. 3","contentHtml":"","notesHtml":""},{"id":"art_129","numText":"Art. 129","group":"-","heading":"ARTICOLO ABROGATO DALLA L. COSTITUZIONALE 18 OTTOBRE 2001, N. 3","contentHtml":"","notesHtml":""},{"id":"art_130","numText":"Art. 130","group":"-","heading":"ARTICOLO ABROGATO DALLA L. COSTITUZIONALE 18 OTTOBRE 2001, N. 3","contentHtml":"","notesHtml":""},{"id":"art_131","numText":"Art. 131","group":"-","heading":"","contentHtml":"<p>Sono costituite le seguenti Regioni:</p>\n<p>Piemonte; Marche;</p>\n<p>Valle d'Aosta; Lazio;</p>\n<p>Lombardia; Abruzzi;</p>\n<p>Trentino-Alto Adige; Molise;</p>\n<p>Veneto; Campania;</p>\n<p>Friuli-Venezia Giulia; Puglia;</p>\n<p>Liguria; Basilicata;</p>\n<p>Emilia-Romagna; Calabria;</p>\n<p>Toscana; Sicilia;</p>\n<p>Umbria; Sardegna.</p>","notesHtml":""},{"id":"art_132","numText":"Art. 132","group":"-","heading":"","contentHtml":"<p>Si può con legge costituzionale, sentiti i Consigli regionali, disporre la fusione di Regioni esistenti o la creazione di nuove Regioni con un minimo di un milione d'abitanti, quando ne facciano richiesta tanti Consigli comunali che rappresentino almeno un terzo delle popolazioni interessate, e la proposta sia approvata con referendum dalla maggioranza delle popolazioni stesse.</p>\n<p>Si può, con l'approvazione della maggioranza delle popolazioni della Provincia o delle Province interessate e del Comune o dei Comuni interessati espressa mediante referendum e con legge della Repubblica, sentiti i Consigli regionali, consentire che Provincie e Comuni, che ne facciano richiesta, siano staccati da una Regione ed aggregati ad un'altra.</p>","notesHtml":""},{"id":"art_133","numText":"Art. 133","group":"-","heading":"","contentHtml":"<p>Il mutamento delle circoscrizioni provinciali e la istituzione di nuove Provincie nell'ambito d'una Regione sono stabiliti con leggi della Repubblica, su iniziative dei Comuni, sentita la stessa Regione.</p>\n<p>La Regione, sentite le popolazioni interessate, può con sue leggi istituire nel proprio territorio nuovi Comuni e modificare le loro circoscrizioni e denominazioni.</p>","notesHtml":""},{"id":"art_134","numText":"Art. 134","group":"-","heading":"","contentHtml":"<p>La Corte costituzionale giudica:</p>\n<p>sulle controversie relative alla legittimità costituzionale delle leggi e degli atti, aventi forza di legge, dello Stato e delle Regioni;</p>\n<p>sui conflitti di attribuzione tra i poteri dello Stato e su quelli tra lo Stato e le Regioni, e tra le Regioni;</p>\n<p>sulle accuse promosse contro il Presidente della Repubblica . . . , a norma della Costituzione.</p>","notesHtml":""},{"id":"art_135","numText":"Art. 135","group":"-","heading":"","contentHtml":"<p>La Corte costituzionale è composta di quindici giudici nominati per un terzo dal Presidente della Repubblica, per un terzo dal Parlamento in seduta comune e per un terzo dalle supreme magistrature ordinaria ed amministrative.</p>\n<p>I giudici della Corte costituzionale sono scelti fra i magistrati anche a riposo delle giurisdizioni superiori ordinaria ed amministrative, i professori ordinari di università in materie giuridiche e gli avvocati dopo venti anni di esercizio.</p>\n<p>I giudici della Corte costituzionale sono nominati per nove anni, decorrenti per ciascuno di essi dal giorno del giuramento, e non possono essere nuovamente nominati.</p>\n<p>Alla scadenza del termine il giudice costituzionale cessa dalla carica e dall'esercizio delle funzioni.</p>\n<p>La Corte elegge tra i suoi componenti, secondo le norme stabilite dalla legge, il Presidente, che rimane in carica per un triennio, ed è rieleggibile, fermi in ogni caso i termini di scadenza dall'ufficio di giudice.</p>\n<p>L'ufficio di giudice della Corte è incompatibile con quello di membro del Parlamento, di un Consiglio regionale, con l'esercizio della professione di avvocato e con ogni carica ed ufficio indicati dalla legge.</p>\n<p>Nei giudizi d'accusa contro il Presidente della Repubblica</p>\n<p>. . . intervengono, oltre i giudici ordinari della Corte, sedici membri tratti a sorte da un elenco di cittadini aventi i requisiti per l'eleggibilità a senatore, che il Parlamento compila ogni nove anni mediante elezione con le stesse modalità stabilite</p>\n<p>per la nomina dei giudici ordinari.</p>","notesHtml":""},{"id":"art_136","numText":"Art. 136","group":"-","heading":"","contentHtml":"<p>Quando la Corte dichiara l'illegittimità costituzionale di una norma di legge o di atto avente forza di legge, la norma cessa di avere efficacia dal giorno successivo alla pubblicazione della decisione.</p>\n<p>La decisione della Corte è pubblicata e comunicata alle Camere ed ai Consigli regionali interessati, affinchè, ove lo ritengano necessario, provvedano nelle forme costituzionali.</p>","notesHtml":""},{"id":"art_137","numText":"Art. 137","group":"-","heading":"","contentHtml":"<p>Una legge costituzionale stabilisce le condizioni, le forme, i termini di proponibilità dei giudizi di legittimità costituzionale, e le garanzie d'indipendenza dei giudici della Corte.</p>\n<p>Con legge ordinaria sono stabilite le altre norme necessarie per la costituzione e il funzionamento della Corte.</p>\n<p>Contro le decisioni della Corte costituzionale non è ammessa alcuna impugnazione.</p>","notesHtml":""},{"id":"art_138","numText":"Art. 138","group":"-","heading":"","contentHtml":"<p>Le leggi di revisione della Costituzione e le altre leggi costituzionali sono adottate da ciascuna Camera con due successive deliberazioni ad intervallo non minore di tre mesi, e sono approvate a maggioranza assoluta dei componenti di ciascuna Camera nella seconda votazione.</p>\n<p>Le leggi stesse sono sottoposte a referendum popolare quando, entro tre mesi dalla loro pubblicazione, ne facciano domanda un quinto dei membri di una Camera o cinquecentomila elettori o cinque Consigli regionali. La legge sottoposta a referendum non è promulgata, se non è approvata dalla maggioranza dei voti validi.</p>\n<p>Non si fa luogo a referendum se la legge è stata approvata nella seconda votazione da ciascuna delle Camere a maggioranza di due terzi dei suoi componenti.</p>","notesHtml":""},{"id":"art_139","numText":"Art. 139","group":"-","heading":"","contentHtml":"<p>La forma repubblicana non può essere oggetto di revisione costituzionale.</p>","notesHtml":""},{"id":"art_I","numText":"Disp. trans. I","group":"Disposizioni transitorie e finali","heading":"DISPOSIZIONI TRANSITORIE E FINALI","contentHtml":"<p>I</p>\n<p>Con l'entrata in vigore della Costituzione il Capo provvisorio dello Stato esercita le attribuzioni di Presidente della Repubblica e ne assume il titolo.</p>","notesHtml":""},{"id":"art_II","numText":"Disp. trans. II","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Se alla data della elezione del Presidente della Repubblica non sono costituiti tutti i Consigli regionali, partecipano alla elezione soltanto i componenti delle due Camere.</p>","notesHtml":""},{"id":"art_III","numText":"Disp. trans. III","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Per la prima composizione del Senato della Repubblica sono nominati senatori, con decreto del Presidente della Repubblica, i deputati dell'Assemblea Costituente che posseggono i requisiti di legge per essere senatori e che:</p>\n<p>sono stati presidenti del Consiglio dei Ministri o di Assemblee legislative;</p>\n<p>hanno fatto parte del disciolto Senato;</p>\n<p>hanno avuto almeno tre elezioni, compresa quella all'Assemblea Costituente;</p>\n<p>sono stati dichiarati decaduti nella seduta della Camera dei deputati del 9 novembre 1926;</p>\n<p>hanno scontato la pena della reclusione non inferiore a cinque anni in seguito a condanna del tribunale speciale fascista per la difesa dello Stato.</p>\n<p>Sono nominati altresì senatori, con decreto del Presidente della Repubblica, i membri del disciolto Senato che hanno fatto parte della Consulta Nazionale.</p>\n<p>Al diritto di essere nominati senatori si può rinunciare prima della firma del decreto di nomina. L'accettazione della candidatura alle elezioni politiche implica rinuncia al diritto di nomina a senatore.</p>","notesHtml":""},{"id":"art_IV","numText":"Disp. trans. IV","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Per la prima elezione del Senato il Molise è considerato come Regione a sé stante, con il numero dei senatori che gli compete in base alla sua popolazione.</p>","notesHtml":""},{"id":"art_V","numText":"Disp. trans. V","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>La disposizione dell'articolo 80 della Costituzione, per quanto concerne i trattati internazionali che importano oneri alle finanze o modificazioni di legge, ha effetto dalla data di convocazione delle Camere.</p>","notesHtml":""},{"id":"art_VI","numText":"Disp. trans. VI","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Entro cinque anni dall'entrata in vigore della Costituzione si procede alla revisione degli organi speciali di giurisdizione attualmente esistenti, salvo le giurisdizioni del Consiglio di Stato, della Corte dei conti e dei tribunali militari.</p>\n<p>Entro un anno dalla stessa data si provvede con legge al riordinamento del Tribunale supremo militare in relazione all'articolo 111.</p>","notesHtml":""},{"id":"art_VII","numText":"Disp. trans. VII","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Fino a quando non sia emanata la nuova legge sull'ordinamento giudiziario in conformità con la Costituzione, continuano ad osservarsi le norme dell'ordinamento vigente.</p>\n<p>Fino a quando non entri in funzione la Corte costituzionale, la decisione delle controversie indicate nell'articolo 134 ha luogo nelle forme e nei limiti delle norme preesistenti all'entrata in vigore della Costituzione.</p>\n<p>COMMA ABROGATO DALLA L. COSTITUZIONALE 22 NOVEMBRE 1967, N. 2.</p>","notesHtml":""},{"id":"art_VIII","numText":"Disp. trans. VIII","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Le elezioni dei Consigli regionali e degli organi elettivi delle amministrazioni provinciali sono indette entro un anno dall'entrata in vigore della Costituzione.</p>\n<p>Leggi della Repubblica regolano per ogni ramo della pubblica amministrazione il passaggio delle funzioni statali attribuite alle Regioni. Fino a quando non sia provveduto al riordinamento e alla distribuzione delle funzioni amministrative fra gli enti locali restano alle Provincie ed ai Comuni le funzioni che esercitano attualmente e le altre di cui le Regioni deleghino loro l'esercizio.</p>\n<p>Leggi della Repubblica regolano il passaggio alle Regioni di funzionari e dipendenti dello Stato, anche delle amministrazioni centrali, che sia reso necessario dal nuovo ordinamento. Per la formazione dei loro uffici le Regioni devono, tranne che in casi di necessità, trarre il proprio personale da quello dello Stato e degli enti locali.</p>","notesHtml":""},{"id":"art_IX","numText":"Disp. trans. IX","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>La Repubblica, entro tre anni dall'entrata in vigore della Costituzione, adegua le sue leggi alle esigenze delle autonomie locali e alla competenza legislativa attribuita alle Regioni.</p>","notesHtml":""},{"id":"art_X","numText":"Disp. trans. X","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Alla Regione del Friuli-Venezia Giulia, di cui all'articolo 116, si applicano provvisoriamente le norme generali del Titolo V della parte seconda, ferma restando la tutela delle minoranze linguistiche in conformità con l'articolo 6.</p>","notesHtml":""},{"id":"art_XI","numText":"Disp. trans. XI","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Fino a cinque anni dall'entrata in vigore della Costituzione si possono, con leggi costituzionali, formare altre Regioni, a modificazione dell'elenco di cui all'articolo 131, anche senza il concorso delle condizioni richieste dal primo comma dell'articolo 132, fermo rimanendo tuttavia l'obbligo di sentire le popolazioni interessate. <sup class=\"amd\">2</sup></p>","notesHtml":"<p>AGGIORNAMENTO (2)</p>\n<p>La L. costituzionale 18 marzo 1958, n. 1 ha disposto (con l'articolo unico) che \"Il termine di cui alla XI delle \"Disposizioni transitorie e finali\" della Costituzione scadrà il 31 dicembre 1963\".</p>"},{"id":"art_XII","numText":"Disp. trans. XII","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>È vietata la riorganizzazione, sotto qualsiasi forma, del disciolto partito fascista.</p>\n<p>In deroga all'articolo 48, sono stabilite con legge, per non oltre un quinquennio dalla entrata in vigore della Costituzione, limitazioni temporanee al diritto di voto e alla eleggibilità per i capi responsabili del regime fascista.</p>","notesHtml":""},{"id":"art_XIII","numText":"Disp. trans. XIII","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>I membri e i discendenti di Casa Savoia non sono elettori e non possono ricoprire uffici pubblici né cariche elettive. <sup class=\"amd\">15</sup></p>\n<p>Agli ex re di Casa Savoia, alle loro consorti e ai loro discendenti maschi sono vietati l'ingresso e il soggiorno nel territorio nazionale. <sup class=\"amd\">15</sup></p>\n<p>I beni, esistenti nel territorio nazionale, degli ex re di Casa Savoia, delle loro consorti e dei loro discendenti maschi, sono avocati allo Stato. I trasferimenti e le costituzioni di diritti reali sui beni stessi, che siano avvenuti dopo il 2 giugno 1946, sono nulli.</p>","notesHtml":"<p>AGGIORNAMENTO (15)</p>\n<p>La L. costituzionale 23 ottobre 2002, n. 1, ha disposto (con l'art. 1, comma 1) che \"I commi primo e secondo della XIII disposizione transitoria e finale della Costituzione esauriscono i loro effetti a decorrere dalla data di entrata in vigore della presente legge costituzionale\".</p>"},{"id":"art_XIV","numText":"Disp. trans. XIV","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>I titoli nobiliari non sono riconosciuti.</p>\n<p>I predicati di quelli esistenti prima del 28 ottobre 1922 valgono come parte del nome.</p>\n<p>L'Ordine mauriziano è conservato come ente ospedaliero e funziona nei modi stabiliti dalla legge.</p>\n<p>La legge regola la soppressione della Consulta araldica.</p>","notesHtml":""},{"id":"art_XV","numText":"Disp. trans. XV","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Con l'entrata in vigore della Costituzione si ha per convertito in legge il decreto legislativo luogotenenziale 25 giugno 1944, n. 151, sull'ordinamento provvisorio dello Stato.</p>","notesHtml":""},{"id":"art_XVI","numText":"Disp. trans. XVI","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>Entro un anno dall'entrata in vigore della Costituzione si procede alla revisione e al coordinamento con essa delle precedenti leggi costituzionali che non siano state finora esplicitamente o implicitamente abrogate.</p>","notesHtml":""},{"id":"art_XVII","numText":"Disp. trans. XVII","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>L'Assemblea Costituente sarà convocata dal suo Presidente per deliberare, entro il 31 gennaio 1948, sulla legge per la elezione del Senato della Repubblica, sugli statuti regionali speciali e sulla legge per la stampa.</p>\n<p>Fino al giorno delle elezioni delle nuove Camere, la Assemblea Costituente può essere convocata, quando vi sia necessità di deliberare nelle materie attribuite alla sua competenza dagli articoli 2, primo e secondo comma, e 3, comma primo e secondo, del decreto legislativo 16 marzo 1946, n. 98.</p>\n<p>In tale periodo le Commissioni permanenti restano in funzione.</p>\n<p>Quelle legislative rinviano al Governo i disegni di legge, ad esse trasmessi, con eventuali osservazioni e proposte di emendamenti.</p>\n<p>I deputati possono presentare al Governo interrogazioni con richiesta di risposta scritta.</p>\n<p>L'Assemblea Costituente, agli effetti di cui al secondo comma del presente articolo, è convocata dal suo Presidente su richiesta motivata del Governo o di almeno duecento deputati.</p>","notesHtml":""},{"id":"art_XVIII","numText":"Disp. trans. XVIII","group":"Disposizioni transitorie e finali","heading":"","contentHtml":"<p>La presente Costituzione è promulgata dal Capo provvisorio dello Stato entro cinque giorni dalla sua approvazione da parte dell'Assemblea Costituente, ed entra in vigore il 1° gennaio 1948.</p>\n<p>Il testo della Costituzione è depositato nella sala comunale di ciascun Comune della Repubblica per rimanervi esposto, durante tutto l'anno 1948, affinchè ogni cittadino possa prenderne cognizione.</p>\n<p>La Costituzione, munita del sigillo dello Stato, sarà inserita nella Raccolta ufficiale delle leggi e dei decreti della Repubblica.</p>\n<p>La Costituzione dovrà essere fedelmente osservata come Legge fondamentale della Repubblica da tutti i cittadini e dagli organi dello Stato.</p>\n<p>Data a Roma, addì 27 dicembre 1947</p>\n<p>ENRICO DE NICOLA</p>\n<p>Controfirmano:</p>\n<p>Il Presidente dell'Assemblea Costituente</p>\n<p>UMBERTO TERRACINI</p>\n<p>Il Presidente del Consiglio dei Ministri V: Il Guardasigilli</p>\n<p>ALCIDE DE GASPERI GRASSI</p>","notesHtml":""}]
};</script>
<script>
(function() {
  'use strict';
  // DATA is injected per page

  var currentIdx = 0;
  var filteredIndices = CODE.articles.map(function(_, i) { return i; });

  function init() {
    // Pre-compute plain text for full-text search
    CODE.articles.forEach(function(art) {
      art._searchText = (art.numText + ' ' + (art.heading || '') + ' ' +
        (art.contentHtml || '').replace(/<[^>]+>/g, '')).toLowerCase();
    });
    renderToc();

    // Navigate to hash article if present, otherwise show first article
    var initHash = location.hash.replace('#', '');
    var initIdx = 0;
    if (initHash) {
      var found = CODE.articles.findIndex(function(a) { return a.id === initHash || a.numText === decodeURIComponent(initHash); });
      if (found >= 0) initIdx = found;
    }
    showArticle(initIdx);
    populateJump();

    // Workaround WebView Android: dopo il primo render dinamico il gesture
    // detector non si attiva finché l'utente non tocca un elemento focusabile.
    // Forziamo un piccolo "tickle" scroll + resize per svegliarlo.
    setTimeout(function() {
      window.scrollTo(0, 1); window.scrollTo(0, 0);
      window.dispatchEvent(new Event('resize'));
    }, 50);
    setTimeout(function() { window.scrollTo(0, 1); window.scrollTo(0, 0); }, 400);

    document.getElementById('search').addEventListener('input', onSearch);
    document.getElementById('prev-btn').addEventListener('click', function() { navigate(-1); });
    document.getElementById('next-btn').addEventListener('click', function() { navigate(1); });
    document.getElementById('hamburger').addEventListener('click', toggleSidebar);
    document.getElementById('overlay').addEventListener('click', closeSidebar);
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
    });
    window.addEventListener('hashchange', onHashChange);
  }

  function onHashChange() {
    var hash = location.hash.replace('#', '');
    if (!hash) return;
    var idx = CODE.articles.findIndex(function(a) { return a.id === hash || a.numText === decodeURIComponent(hash); });
    if (idx >= 0) showArticle(idx);
  }

  function renderToc() {
    var nav = document.getElementById('toc');
    var html = '';
    var lastGroup = null;
    CODE.articles.forEach(function(art, i) {
      if (art.group && art.group !== lastGroup) {
        html += '<div class="group-label">' + esc(art.group) + '</div>';
        lastGroup = art.group;
      }
      html += '<div class="art-link" data-idx="' + i + '" onclick="goTo(' + i + ')">' +
        '<span class="art-num">' + esc(art.numText) + '</span>' +
        '<span class="art-heading-mini">' + esc(art.heading || '') + '</span>' +
        '</div>';
    });
    nav.innerHTML = html;
  }

  function populateJump() {
    var sel = document.getElementById('article-jump');
    if (!sel) return;
    var html = '';
    var lastGroup = null;
    var inGroup = false;
    CODE.articles.forEach(function(art, i) {
      if (art.group && art.group !== lastGroup) {
        if (inGroup) html += '</optgroup>';
        var gLabel = art.group.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        html += '<optgroup label="' + gLabel + '">';
        lastGroup = art.group;
        inGroup = true;
      }
      var label = art.numText + (art.heading ? ' — ' + art.heading : '');
      if (label.length > 90) label = label.slice(0, 87) + '…';
      var safe = label.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      html += '<option value="' + i + '">' + safe + '</option>';
    });
    if (inGroup) html += '</optgroup>';
    sel.innerHTML = html;
    sel.addEventListener('change', function() {
      var idx = parseInt(this.value, 10);
      if (!isNaN(idx)) showArticle(idx);
    });
  }

  function showArticle(idx) {
    if (idx < 0 || idx >= CODE.articles.length) return;
    currentIdx = idx;
    var art = CODE.articles[idx];

    // Sync dropdown jump
    var jumpSel = document.getElementById('article-jump');
    if (jumpSel) jumpSel.value = String(idx);

    // Update URL hash
    history.replaceState(null, '', '#' + encodeURIComponent(art.numText));

    // Update header title
    document.getElementById('header-article').textContent = art.numText + (art.heading ? ' – ' + art.heading : '');

    // Render article
    var notesSection = art.notesHtml
      ? '<div class="article-notes">' +
        '<button class="notes-toggle" onclick="toggleNotes(this)">Aggiornamenti e note</button>' +
        '<div class="notes-body"><div class="article-body">' + art.notesHtml + '</div></div>' +
        '</div>'
      : '';

    document.getElementById('article-view').innerHTML =
      '<div class="article-card">' +
        '<div class="article-badge">📖 ' + esc(CODE.shortTitle) + '</div>' +
        '<h1 class="article-num">' + esc(art.numText) + '</h1>' +
        (art.heading ? '<p class="article-heading">' + esc(art.heading) + '</p>' : '<div style="margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border)"></div>') +
        '<div class="article-body">' + art.contentHtml + '</div>' +
        notesSection +
        '<div class="article-actions">' +
          '<button class="action-btn wa-btn" onclick="shareWhatsApp()" title="Invia su WhatsApp">' +
            '<span class="action-icon">📲</span> WhatsApp' +
          '</button>' +
          '<button class="action-btn" onclick="copyArticle()" title="Copia articolo">' +
            '<span class="action-icon">📋</span> Copia' +
          '</button>' +
        '</div>' +
      '</div>';

    // Update counter
    document.getElementById('article-counter').textContent = (idx + 1) + ' / ' + CODE.articles.length;
    document.getElementById('prev-btn').disabled = idx === 0;
    document.getElementById('next-btn').disabled = idx === CODE.articles.length - 1;

    // Highlight active in TOC
    document.querySelectorAll('.art-link').forEach(function(el) { el.classList.remove('active'); });
    var activeEl = document.querySelector('.art-link[data-idx="' + idx + '"]');
    if (activeEl) {
      activeEl.classList.add('active');
      activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // Scroll main to top
    document.getElementById('main').scrollTop = 0;
    window.scrollTo(0, 0);
  }

  window.goTo = function(idx) { showArticle(idx); closeSidebar(); };

  function navigate(dir) {
    var pos = filteredIndices.indexOf(currentIdx);
    if (pos === -1) pos = 0;
    var newPos = pos + dir;
    if (newPos >= 0 && newPos < filteredIndices.length) {
      showArticle(filteredIndices[newPos]);
    }
  }

  function onSearch(e) {
    var q = e.target.value.toLowerCase().trim();
    filteredIndices = [];
    document.querySelectorAll('.art-link').forEach(function(el) {
      var idx = parseInt(el.dataset.idx, 10);
      var art = CODE.articles[idx];
      var hidden = q && !art._searchText.includes(q);
      el.classList.toggle('hidden', hidden);
      if (!hidden) filteredIndices.push(idx);
    });
    if (!q) filteredIndices = CODE.articles.map(function(_, i) { return i; });
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('visible');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('visible');
  }
  window.toggleNotes = function(btn) {
    btn.classList.toggle('open');
    btn.nextElementSibling.classList.toggle('visible');
  };

  function getArticleText(art, bold) {
    var body = (art.contentHtml || '').replace(/<\/p>\s*<p>/gi, '\n').replace(/<[^>]+>/g, '').replace(/[ \t]+/g, ' ').trim();
    var heading = art.numText;
    if (art.heading) heading += ' – ' + art.heading;
    if (bold) heading = '*' + heading + '*';
    return CODE.title + '\n' + heading + '\n' + body;
  }

  window.shareWhatsApp = function() {
    var art = CODE.articles[currentIdx];
    var text = getArticleText(art, true);
    var url = 'https://wa.me/?text=' + encodeURIComponent(text);
    window.open(url, '_blank');
  };

  window.copyArticle = function() {
    var art = CODE.articles[currentIdx];
    var text = getArticleText(art, false);
    navigator.clipboard.writeText(text).then(function() {
      showToast('Articolo copiato negli appunti');
    }, function() {
      // fallback
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Articolo copiato negli appunti');
    });
  };

  function showToast(msg) {
    var el = document.getElementById('copy-toast');
    el.textContent = msg;
    el.classList.add('visible');
    setTimeout(function() { el.classList.remove('visible'); }, 2000);
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
